spring.application.name=extratech-backend


# Importa o .env da raiz do projeto (opcional: não quebra se o arquivo não existir)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Servidor
server.port=${SERVER_PORT:8080}


# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Fuso horário
spring.jpa.properties.hibernate.jdbc.time_zone=${TZ:America/Sao_Paulo}


# E-mail (código de recuperação de senha)
# EMAIL_MODO=log  -> o código só aparece no console do back-end (padrão)
# EMAIL_MODO=smtp -> envia de verdade pelo servidor SMTP abaixo (ex.: Mailtrap)
app.email.modo=${EMAIL_MODO:log}
app.email.remetente=${MAIL_REMETENTE:nao-responda@extratechrestre.com.br}
app.email.nome-remetente=${MAIL_NOME_REMETENTE:ExtraTechRestre}

spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
# Limites de tempo (ms) para a tela não ficar esperando se o servidor de e-mail não responder
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
