spring.application.name=extratech-backend


# Importa o .env da raiz do projeto (opcional: não quebra se o arquivo não existir)
spring.config.import=optional:file:../.env[.properties]

# Servidor
server.port=${SERVER_PORT:8080}


# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:extratech}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Fuso horário
spring.jpa.properties.hibernate.jdbc.time_zone=${TZ:America/Sao_Paulo}