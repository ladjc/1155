<div class="alert alerta-flutuante alerta-quadrado" *ngIf="mensagem.length>0">{{mensagem}}</div>

<div class="container">
    <div class="card card-login">
        <h2>Entre com seu e-mail e senha</h2>

        <form class="was-validated">
            <div class="input-group mb-3 input-group-lg">
                <span class="input-group-text sp-inp">E-mail</span>
                <input type="email" class="form-control" (ngModel)="email" placeholder="Digite seu E-mail" required>
            </div>

            <div class="input-group mb-3 input-group-lg">
                <span class="input-group-text sp-inp">Senha</span>
                <input type="password" class="form-control" (ngModel)="senha" placeholder="Digite sua Senha" required> 
                <!-- pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[#@$!%*?&])[A-Za-z\d#@$!%*?&]{8,}" --> 
            </div>
        </form>
        <div class="row"> 
            <button type="button" (click)="fazerLogin()" class="btn-in">Entrar</button>        
            <button type="button" (click)="esqueciSenha()" class="btn-in">Esqueci a Senha</button>           
        </div>
    </div>
</div>

<div class="container">
    <div class="card">
        <h3>Não possui cadastro</h3>
        <p>Clique <a class="ir-cad" href="cadastro">aqui</a> e faça o seu agora mesmo</p>
    </div>

</div>
